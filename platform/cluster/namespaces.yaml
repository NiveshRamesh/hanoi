# Pod Security Admission "restricted" = non-root, no privilege escalation, drop ALL caps,
# seccomp RuntimeDefault. Built into Kubernetes, no extra install needed.
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
  labels:
    env: smoke
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: qa
  labels:
    env: qa
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
